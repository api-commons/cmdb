context: cmdb
name: ITSM Change and CMDB
intro: >-
  The common ITSM vocabulary beyond the ticket -- the configuration items a CMDB tracks, the
  change requests that alter them and the problems that explain recurring incidents --
  distilled from the APIs that already exist. Incidents and service requests belong to the
  help-desk context.
tags: [ITSM, IT Service Management, CMDB, Change Management, Problem Management, ITIL, Service Management, IT Operations]

envelope: [_links, _pagination, _results, data, success, errors, warnings, count, total, page, meta, links,
           value, results, next, previous, has_more, message, status_code, ids, next_page, previous_page,
           page_info, cursor, total_count, per_page, total_pages, current_page, object, url, result]

common_fields:
  id: [uuid, guid, object_id, record_id, sys_id, display_id]
  created_at: [created, created_date, date_created, create_time, creation_date, created_on, sys_created_on, opened_at]
  updated_at: [updated, updated_date, modified_at, last_modified, date_modified, update_time, modified_date, modified, sys_updated_on]
  metadata: [meta_data, custom_fields, custom, attributes, properties, tags]
  status: [state, stage, approval, approval_status]
  name: [title, display_name, label, short_description, subject, summary]
  description: [details, notes, justification, body]
  assignee_id: [assigned_to, assignee, owner_id, owner, agent_id, responder_id]
  group_id: [assignment_group, group, team_id, department_id]

concepts:
  # configuration_item was measured and dropped: no provider in the cohort publishes CIs as a
  # named resource.
  change_request:
    path: /change-requests
    segments: [changes, change, change_requests, change-requests, changerequests, rfcs]
    aliases:
      type: [change_type, category]
      risk: [risk_level, impact, priority]
      planned_start: [start_date, planned_start_date, scheduled_start]
      planned_end: [end_date, planned_end_date, scheduled_end]
      requester_id: [requested_by, requester, created_by]
      configuration_item_ids: [cmdb_ci, cis, assets, affected_cis]
  # problem was measured and dropped: 2 readable providers.

findings:
  - "ITSM beyond the ticket is nearly invisible as OpenAPI (32 providers, 4 mapped). The market's
    largest platform exposes every ITSM record through a generic table API (`/table/{tableName}`),
    so configuration items, changes and problems have no resource paths to measure."
  - "A change request agrees on its title and description where it is a resource (3 providers):
    too few to say more."
decisions:
  - "Incidents and service requests stay in help desk; this context keeps changes, problems and
    the CMDB."
  - "Configuration items and problems were measured and dropped. A table-API reader -- one that
    reads a provider's table schemas as resources -- would recover them; it is recorded for the
    tooling backlog."
